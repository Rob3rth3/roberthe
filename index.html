<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roberthe</title>

    <style>
        @font-face {
            font-family: 'Roberte';
            src: url('./Roberte-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg: #000000;
            --fg: #ffffff;
            --muted: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            font-family: sans-serif;
        }

        .home {
            text-align: center;
        }

        h1 {
            margin: 0;
            color: var(--fg);
            font-family: 'Roberte', sans-serif;
            font-size: clamp(4rem, 12vw, 12rem);
            font-weight: normal;
            line-height: 0.9;
            letter-spacing: 0.04em;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(1.2rem, 4vw, 3rem);
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        a {
            color: var(--fg);
            font-family: 'Roberte', sans-serif;
            font-size: clamp(1.4rem, 2.4vw, 2.5rem);
            font-weight: normal;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        a:hover {
            text-decoration: underline;
            opacity: 0.9;
        }

        .credit {
            position: fixed;
            right: 12px;
            bottom: 10px;
            color: var(--muted);
            font-family: sans-serif;
            font-size: 8px;
            font-weight: normal;
            letter-spacing: 0.05em;
            text-decoration: none;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }

        @media (max-width: 600px) {
            body {
                padding: 1.5rem 1rem;
            }

            nav {
                gap: 1rem 1.5rem;
            }

            .credit {
                right: 8px;
                bottom: 8px;
                font-size: 7px;
            }
        }
    </style>
</head>

<body>
    <main class="home">
        <h1>Roberthe</h1>

        <nav aria-label="Navigation principale">
            <a href="pipe.html">Pipe</a>
            <a href="https://www.mixcloud.com/clemencebmr/" target="_blank" rel="noopener noreferrer">Sons</a>
        </nav>
    </main>

    <a class="credit"
       href="https://typotheque.byebyebinary.space/"
       target="_blank"
       rel="noopener noreferrer">
        Roberte — Eugénie Bidaut · Bye Bye Binary
    </a>
</body>
</html>
